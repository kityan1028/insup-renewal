<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">

<style>
  /* ===== 入口ページ — E4「ガラスのきらめき」 (ported from v5parts/ent.html, E4 only) ===== */
  :root{--navy:#0b2d6b;--blue:#1976f6;--sky:#4db3ff;--pale:#ebf4ff;--deep:#06183d;--ice:#75f2ff;--ink:#0b1d40;
    /* fonts — F6 「上質・落ち着き」, same three variables as assets/css/site.css?v=1e0bd44e14 (keep in sync) */
    --font-ja:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
    --font-en:"Cormorant Garamond","Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
    --font-head:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
  /* F6: same-height numbers (Cormorant's default figures dip below the line); `font:` shorthands reset it, hence * + !important */
  html.ff-f6 *{font-variant-numeric:lining-nums!important}
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font-ja);line-height:1.7;color:#fff;background:#dfe8f4;overflow:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  .es{position:fixed;inset:0;height:100vh;height:100svh;overflow:hidden;background:#dfe8f4;touch-action:pan-y}
  .es .pan{position:absolute;inset:-4%;will-change:transform}
  .es .photo{position:absolute;inset:0;background:url(assets/img/reception.jpg) 44% 50%/cover no-repeat;filter:brightness(1.24) saturate(1.04) contrast(1.02)}
  .es .lay{position:absolute;inset:0;pointer-events:none}
  .fx-host{position:absolute;inset:0;pointer-events:none}
  .fx-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* E4 glossy sheen + light leak */
  .es .sheen{overflow:hidden}
  .es .sheen i{position:absolute;top:-10%;bottom:-10%;left:-55%;width:42%;transform:translateX(0) skewX(-18deg);
    background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.1) 30%,rgba(255,255,255,.5) 47%,rgba(255,255,255,.72) 50%,rgba(255,255,255,.5) 53%,rgba(255,255,255,.1) 70%,rgba(255,255,255,0) 100%)}
  .es .sheen i+i{width:9%;left:-25%;opacity:.7}
  .es .leak{background:radial-gradient(55% 65% at 100% 0%,rgba(255,255,255,.78) 0%,rgba(235,250,255,.38) 32%,rgba(117,242,255,.08) 55%,rgba(255,255,255,0) 72%),radial-gradient(45% 40% at 0% 100%,rgba(235,244,255,.35),rgba(235,244,255,0) 70%)}
  .es .shade{background:linear-gradient(180deg,rgba(255,255,255,0) 58%,rgba(244,250,255,.6) 84%,rgba(244,250,255,.85) 100%)}

  /* UI */
  .es .ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
    padding:clamp(16px,2.6vw,32px) clamp(16px,3.2vw,44px) calc(clamp(14px,2.2vw,26px) + env(safe-area-inset-bottom,0px))}
  .es .bar{display:flex;align-items:center;justify-content:space-between}
  .plate{display:inline-flex;align-items:center;gap:7px;background:#fff;padding:6px 14px 6px 9px;border-radius:12px;box-shadow:0 4px 16px rgba(11,45,107,.14);line-height:0;margin:0}
  .plate img{height:26px;width:auto}
  .plate img.type{height:16px}
  .es .entry{margin-top:auto}
  .es .tag{font:700 14px var(--font-en);letter-spacing:.3em;margin:0;color:var(--navy);text-shadow:0 0 10px rgba(255,255,255,.95),0 0 2px rgba(255,255,255,.9)}
  .es .msg{font-size:clamp(14px,1.5vw,18px);margin:4px 0 16px;color:var(--ink);font-weight:700;text-shadow:0 0 14px rgba(255,255,255,.95),0 0 3px rgba(255,255,255,.95)}
  .es .doors{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:820px}
  .es .door{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 22px;border-radius:16px;text-decoration:none;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .25s,box-shadow .25s}
  .es .door:hover{transform:translateY(-2px)}
  .es .door small{display:block;font:700 12.5px var(--font-en);letter-spacing:.22em;opacity:.85}
  .es .door b{font-size:clamp(15px,1.6vw,19px)}
  .es .door .arr{font:600 19px var(--font-en);transition:transform .3s}
  .es .door:hover .arr{transform:translateX(4px)}
  .es .door.biz{background:linear-gradient(100deg,#1976f6,#4db3ff);color:#fff;box-shadow:0 8px 22px rgba(25,118,246,.26)}
  .es .door.car{background:rgba(255,255,255,.95);color:var(--navy);box-shadow:0 8px 22px rgba(11,45,107,.12);border:1px solid rgba(11,45,107,.08)}
  .es .door.car small{color:var(--blue);opacity:1}
  /* F6: thin Cormorant on the blue door — full white, a touch larger, faint navy shadow for legibility */
  html.ff-f6 .es .door.biz small{opacity:1;font-size:13.5px;text-shadow:0 1px 2px rgba(11,45,107,.6),0 0 6px rgba(11,45,107,.35)}
  .es .fine{pointer-events:auto;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin:14px 0 0;font-size:12px;color:#3e4f70}
  .es .fine small{font:600 13px var(--font-en)}
  .es .fine a{color:var(--navy);text-underline-offset:3px}
  @media (max-width:700px){
    .es .doors{grid-template-columns:1fr;gap:10px}
    .es .msg{display:none}
    .es .tag{margin-bottom:10px}
    .es .door{padding:13px 18px}
    .plate{padding:5px 11px 5px 7px}.plate img{height:22px}.plate img.type{height:13px}
  }

  /* ---- entrance (one-shot, final state = normal styles) ---- */
  .es.pre .ui > *{opacity:0}
  .es.play .bar{animation:ent-fade .7s .1s ease-out backwards}
  .es.play .tag{animation:ent-up .8s .55s cubic-bezier(.2,.7,.2,1) backwards}
  .es.play .msg{animation:ent-up .8s .7s cubic-bezier(.2,.7,.2,1) backwards}
  .es.play .door.biz{animation:ent-up .8s .85s cubic-bezier(.2,.7,.2,1) backwards}
  .es.play .door.car{animation:ent-up .8s .97s cubic-bezier(.2,.7,.2,1) backwards}
  .es.play .fine{animation:ent-fade .8s 1.2s ease-out backwards}
  .es.play .photo{animation:ent-zoom 2.4s cubic-bezier(.2,.7,.2,1) backwards}
  /* E4: glossy sheen loops (first pass is the entrance), leak breathes */
  .es.play .sheen i{animation:ent-sheen 6s .25s cubic-bezier(.45,0,.25,1) infinite}
  .es.play .sheen i+i{animation-delay:.42s}
  .es.play .leak{animation:ent-fade 1.4s ease-out backwards,ent-breathe 7s 1.4s ease-in-out infinite alternate}
  @keyframes ent-fade{from{opacity:0}}
  @keyframes ent-up{from{opacity:0;transform:translateY(16px)}}
  @keyframes ent-zoom{from{transform:scale(1.05)}}
  @keyframes ent-sheen{0%{transform:translateX(0) skewX(-18deg)}38%,100%{transform:translateX(420%) skewX(-18deg)}}
  @keyframes ent-breathe{from{opacity:1}to{opacity:.6}}
  .es.still *{animation:none !important}
  @media (prefers-reduced-motion:reduce){.es *{animation:none !important;transition:none !important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/js/fx.js?v=2"></script>
</head>
<body>
<main class="es pre" id="ent">
  <div class="pan" id="entPan"><div class="photo"></div></div>
  <div class="lay leak"></div>
  <div class="lay sheen"><i></i><i></i></div>
  <div class="lay shade"></div>
  <div class="fx-host" id="entFx" aria-hidden="true"></div>
  <div class="ui">
    <div class="bar">
      <h1 class="plate"><img src="assets/img/logo-mark.png" alt="" width="658" height="660"><img class="type" src="assets/img/logo-type.png" alt="株式会社Insup" width="977" height="368"></h1>
    </div>
    <div class="entry">
      <p class="tag">WELCOME TO INSUP</p>
      <p class="msg">テレアポBPOを軸に、インサイドセールス支援を行う企業です。</p>
      <nav class="doors" aria-label="ページを選ぶ">
        <a class="door biz" href="business.html"><span><small>FOR BUSINESS</small><b>導入をご検討の企業様</b></span><span class="arr" aria-hidden="true">→</span></a>
        <a class="door car" href="careers.html"><span><small>FOR CAREERS</small><b>一緒に働きたい方</b></span><span class="arr" aria-hidden="true">→</span></a>
      </nav>
      <p class="fine"><small>© 2025 Insup All Rights Reserved.</small><a href="privacy.html">プライバシーポリシー</a></p>
    </div>
  </div>
</main>

<script>
(() => {
  'use strict';
  const slide = document.getElementById('ent'), pan = document.getElementById('entPan');
  const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* door handoff for the T1 arrival on business.html: door centre in 0..1 viewport coords */
  const biz = slide.querySelector('.door.biz');
  biz.addEventListener('click', e => {
    if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const r = biz.getBoundingClientRect();
    const x = (r.left + r.width / 2) / window.innerWidth, y = (r.top + r.height / 2) / window.innerHeight;
    try { sessionStorage.setItem('insup:door', JSON.stringify({ x: +x.toFixed(4), y: +y.toFixed(4) })); } catch (_) { /* storage blocked: plain fade-in */ }
  });

  /* E4 particles: a few soft white sparkles (one WebGL context) */
  const E4 = { count: 12, size: [8, 16], speed: [0.002, 0.012], alpha: 0.7, tw: 0.35, repel: 0.2, sway: 0.02, c1: '#ffffff', c2: '#eaf6ff' };
  function makeEffect(st) {
    const N = E4.count;
    const seed = new Float32Array(N * 4), pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) seed.set([Math.random(), Math.random(), Math.random(), Math.random()], i * 4);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 4));
    const U = {
      uTime: { value: 0 }, uSize: { value: new THREE.Vector2(E4.size[0], E4.size[1]) }, uSpeed: { value: new THREE.Vector2(E4.speed[0], E4.speed[1]) },
      uAlpha: { value: E4.alpha }, uTw: { value: E4.tw }, uRepel: { value: E4.repel }, uSway: { value: E4.sway },
      uM: { value: new THREE.Vector2(9, 9) }, uMA: { value: 0 }, uAspect: { value: 1.6 }, uH: { value: 1 }, uIntro: { value: 0 },
      uC1: { value: new THREE.Color(E4.c1) }, uC2: { value: new THREE.Color(E4.c2) }
    };
    const m = new THREE.ShaderMaterial({
      uniforms: U, transparent: true, depthWrite: false, depthTest: false, blending: THREE.NormalBlending,
      vertexShader: `
        attribute vec4 aSeed;
        uniform float uTime, uAlpha, uTw, uRepel, uSway, uMA, uAspect, uH, uIntro;
        uniform vec2 uSize, uSpeed, uM; uniform vec3 uC1, uC2;
        varying vec3 vCol; varying float vA;
        void main(){
          float sp = 0.6 + aSeed.z * 0.8;
          vec2 p = vec2(fract(aSeed.x + uTime * uSpeed.x * sp), fract(aSeed.y + uTime * uSpeed.y * sp)) * 2.3 - 1.15;
          p.x += sin(uTime * 0.45 + aSeed.w * 6.283) * uSway;
          vec2 d = (p - uM) * vec2(uAspect, 1.0);
          float f = exp(-dot(d, d) * 5.0) * uMA;
          p += normalize(d + 1e-4) / vec2(uAspect, 1.0) * f * 0.16 * uRepel;
          float tw = mix(1.0, 0.12 + 0.88 * pow(0.5 + 0.5 * sin(uTime * (0.9 + aSeed.z * 1.6) + aSeed.w * 40.0), 2.0), uTw);
          float edge = smoothstep(-1.15, -0.85, p.y) * smoothstep(1.15, 0.85, p.y) * smoothstep(-1.15, -0.95, p.x) * smoothstep(1.15, 0.95, p.x);
          vA = uAlpha * tw * edge * smoothstep(0.0, 1.0, uIntro) * (0.55 + 0.45 * aSeed.z) * (1.0 + f * 0.6 * uRepel);
          vCol = mix(uC1, uC2, aSeed.y);
          gl_PointSize = mix(uSize.x, uSize.y, aSeed.z * aSeed.z) * uH * (1.0 + f * 0.7 * uRepel);
          gl_Position = vec4(p, 0.0, 1.0);
        }`,
      fragmentShader: `
        varying vec3 vCol; varying float vA;
        void main(){
          vec2 c = gl_PointCoord - 0.5; float d = length(c);
          float a = smoothstep(0.5, 0.0, d) * 0.35 + smoothstep(0.22, 0.12, d) * 0.65;
          if (a * vA < 0.003) discard;
          gl_FragColor = vec4(vCol, a * vA);
        }`
    });
    const pts = new THREE.Points(g, m); pts.frustumCulled = false; st.scene.add(pts);
    const t0 = performance.now();
    let ma = 0;
    return {
      resize() { U.uH.value = st.renderer.getPixelRatio() * (st.host.clientHeight || 600) / 720; },
      update() {
        const t = reduced ? 6 : st.t;
        U.uTime.value = t; U.uAspect.value = st.aspect;
        U.uIntro.value = reduced ? 1 : Math.min(1, (performance.now() - t0) / 1800);
        ma += ((st.target.lengthSq() > 0 ? 1 : 0) - ma) * 0.06;
        U.uM.value.copy(st.mouse); U.uMA.value = ma;
        if (!reduced) pan.style.transform = `translate(${(-st.mouse.x * 1.5).toFixed(3)}%, ${(st.mouse.y * 1.2).toFixed(3)}%)`;
      }
    };
  }
  let st = null;
  try {
    if (window.InsupFX && window.THREE) {
      st = InsupFX.mount(document.getElementById('entFx'), s => makeEffect(s), { hit: slide });
      st.api.resize();
      if (reduced) setTimeout(() => { st.enabled = false; }, 400); /* one still frame, no autoplaying motion */
    }
  } catch (e) { console.warn('entrance effect not started', e); }

  /* entrance: one-shot; reduced motion shows the final state */
  if (reduced) { slide.classList.remove('pre'); slide.classList.add('still'); }
  else requestAnimationFrame(() => { slide.classList.remove('pre'); void slide.offsetWidth; slide.classList.add('play'); });

  /* back/forward cache: make sure the page is visible again */
  window.addEventListener('pageshow', e => { if (e.persisted) slide.classList.remove('pre'); });
})();
</script>
</body>
