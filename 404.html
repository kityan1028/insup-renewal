<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 404: GitHub Pages serves this file for any missing URL (at any depth), so every path here is absolute from the site root -->
<meta name="robots" content="noindex">
<title>ページが見つかりませんでした | 株式会社Insup</title>
<meta name="theme-color" content="#eef5ff">
<link rel="icon" href="/assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0b2d6b;--blue:#1976f6;--sky:#4db3ff;--ink:#0b1d40;--sub:#4a5b7a;
    --font-ja:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
    --font-en:"Cormorant Garamond","Zen Kaku Gothic New",system-ui,serif}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:var(--font-ja);color:var(--ink);line-height:1.8;-webkit-font-smoothing:antialiased;
    background:radial-gradient(1200px 600px at 50% -10%,#ffffff 0%,rgba(255,255,255,0) 70%),linear-gradient(180deg,#f6faff 0%,#e8f1fd 100%);
    min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:40px 16px}
  :focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}
  .nf{width:100%;max-width:560px;text-align:center}
  .logo{display:inline-block;margin-bottom:clamp(22px,4vw,34px)}
  .logo img{display:block;width:clamp(96px,22vw,128px);height:auto}
  .code{font:700 clamp(64px,14vw,104px)/1 var(--font-en);letter-spacing:.06em;margin:0 0 6px;font-variant-numeric:lining-nums;
    background:linear-gradient(120deg,var(--navy),var(--blue) 55%,var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:clamp(20px,4.6vw,26px);font-weight:700;color:var(--navy);margin:0 0 10px;letter-spacing:.04em}
  p{margin:0 auto 30px;color:var(--sub);font-size:15px;max-width:30em}
  .nw{display:inline-block}
  .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:10px 22px;border-radius:99px;
    font-weight:700;font-size:15px;text-decoration:none;color:var(--navy);background:#fff;border:1px solid rgba(11,45,107,.14);
    box-shadow:0 6px 18px rgba(11,45,107,.08);transition:background .25s,color .25s,border-color .25s,transform .25s}
  .btn:hover{background:var(--blue);color:#fff;border-color:transparent;transform:translateY(-1px)}
  .btn.main{background:var(--navy);color:#fff;border-color:transparent}
  .btn.main:hover{background:var(--blue)}
  @media (max-width:480px){.btns{flex-direction:column;align-items:stretch}}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>
</head>
<body>
<main class="nf">
  <a class="logo" href="/" aria-label="株式会社Insup トップ（入口）へ"><img src="/assets/img/logo-full.png" alt="株式会社Insup" width="977" height="1031"></a>
  <div class="code" aria-hidden="true">404</div>
  <h1>ページが見つかりませんでした</h1>
  <p><span class="nw">お探しのページは移動したか、</span><span class="nw">削除された可能性があります。</span><br>下のボタンからお進みください。</p>
  <div class="btns">
    <a class="btn main" href="/">トップ（入口）</a>
    <a class="btn" href="/business.html">企業様向け</a>
    <a class="btn" href="/careers.html">働きたい方向け</a>
  </div>
</main>
</body>
</html>
